<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 830" width="1280" height="830" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1c2630"/></marker></defs><rect width="1280" height="830" fill="#f3f1ec"/><rect x="40" y="30" width="360" height="80" rx="8" fill="#e9e3d6" stroke="#8a8470" stroke-width="1.6"/><text x="220.0" y="64.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">1. Kaggle dataset</text><text x="220.0" y="86.0" text-anchor="middle" font-size="13" fill="#4a5864">Motley Fool earnings-call transcripts (18,755)</text><rect x="460" y="30" width="360" height="80" rx="8" fill="#e9e3d6" stroke="#8a8470" stroke-width="1.6"/><text x="640.0" y="64.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">2. prepare_data.py</text><text x="640.0" y="86.0" text-anchor="middle" font-size="13" fill="#4a5864">10 companies, 8 quarters, duplicates removed</text><rect x="880" y="30" width="360" height="80" rx="8" fill="#e9e3d6" stroke="#8a8470" stroke-width="1.6"/><text x="1060.0" y="64.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">3. transcripts.csv</text><text x="1060.0" y="86.0" text-anchor="middle" font-size="13" fill="#4a5864">80 transcripts, about 42,700 sentences</text><path d="M400 70 H458" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><path d="M820 70 H878" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><path d="M1060 110 V140 H320 V190" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><path d="M1060 140 H960 V190" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><text x="40" y="172" font-size="17" font-weight="700" fill="#b5483a">A. Rule-based extraction (spaCy)</text><text x="680" y="172" font-size="17" font-weight="700" fill="#3f6b8c">B. Machine learning (scikit-learn)</text><rect x="40" y="190" width="560" height="70" rx="8" fill="#f4dfdb" stroke="#b5483a" stroke-width="1.6"/><text x="320.0" y="219.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">Split into sentences</text><text x="320.0" y="241.0" text-anchor="middle" font-size="13" fill="#4a5864">spaCy en_core_web_sm, keep 8 to 60 words</text><rect x="40" y="288" width="560" height="70" rx="8" fill="#f4dfdb" stroke="#b5483a" stroke-width="1.6"/><text x="320.0" y="317.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">Match risk phrases on lemmas</text><text x="320.0" y="339.0" text-anchor="middle" font-size="13" fill="#4a5864">regulatory, supply chain, macro, competition, liquidity, cyber</text><path d="M320 260 V288" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><rect x="40" y="386" width="560" height="70" rx="8" fill="#f4dfdb" stroke="#b5483a" stroke-width="1.6"/><text x="320.0" y="415.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">Drop negated mentions</text><text x="320.0" y="437.0" text-anchor="middle" font-size="13" fill="#4a5864">'no supply chain disruption' is not a risk</text><path d="M320 358 V386" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><rect x="40" y="484" width="560" height="70" rx="8" fill="#f4dfdb" stroke="#b5483a" stroke-width="1.6"/><text x="320.0" y="513.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">risks.json</text><text x="320.0" y="535.0" text-anchor="middle" font-size="13" fill="#4a5864">risk counts and top sentences per company and quarter</text><path d="M320 456 V484" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><rect x="680" y="190" width="560" height="70" rx="8" fill="#dce7f0" stroke="#3f6b8c" stroke-width="1.6"/><text x="960.0" y="219.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">Sentence dataset</text><text x="960.0" y="241.0" text-anchor="middle" font-size="13" fill="#4a5864">weak labels from the phrase list, matched words masked</text><rect x="680" y="288" width="560" height="70" rx="8" fill="#dce7f0" stroke="#3f6b8c" stroke-width="1.6"/><text x="960.0" y="317.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">TF-IDF features</text><text x="960.0" y="339.0" text-anchor="middle" font-size="13" fill="#4a5864">word 1-grams and 2-grams</text><path d="M960 260 V288" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><rect x="680" y="386" width="560" height="70" rx="8" fill="#dce7f0" stroke="#3f6b8c" stroke-width="1.6"/><text x="960.0" y="415.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">Train 3 classifiers</text><text x="960.0" y="437.0" text-anchor="middle" font-size="13" fill="#4a5864">logistic regression, linear SVM, Naive Bayes</text><path d="M960 358 V386" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><rect x="680" y="484" width="560" height="70" rx="8" fill="#dce7f0" stroke="#3f6b8c" stroke-width="1.6"/><text x="960.0" y="513.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">Leave-companies-out cross-validation</text><text x="960.0" y="535.0" text-anchor="middle" font-size="13" fill="#4a5864">tested on companies never seen; best macro F1 0.49</text><path d="M960 456 V484" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><rect x="680" y="582" width="560" height="70" rx="8" fill="#dce7f0" stroke="#3f6b8c" stroke-width="1.6"/><text x="960.0" y="611.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">metrics.json and saved model</text><text x="960.0" y="633.0" text-anchor="middle" font-size="13" fill="#4a5864">logistic regression kept for live predictions</text><path d="M960 554 V582" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><path d="M320 554 V680" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><path d="M960 652 V680" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><path d="M230 680 H1050" stroke="#1c2630" stroke-width="1.8" fill="none"/><path d="M230 680 V712" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><path d="M640 680 V712" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><path d="M1050 680 V712" fill="none" stroke="#1c2630" stroke-width="1.8" marker-end="url(#a)"/><rect x="40" y="712" width="380" height="90" rx="8" fill="#e0eadc" stroke="#5e7f5b" stroke-width="1.6"/><text x="230.0" y="751.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">Streamlit dashboard</text><text x="230.0" y="773.0" text-anchor="middle" font-size="13" fill="#4a5864">metrics, trends, sentences, classifier, live try-it</text><rect x="450" y="712" width="380" height="90" rx="8" fill="#e0eadc" stroke="#5e7f5b" stroke-width="1.6"/><text x="640.0" y="751.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">Website (GitHub Pages)</text><text x="640.0" y="773.0" text-anchor="middle" font-size="13" fill="#4a5864">3D terrain, trend, explorer, model results</text><rect x="860" y="712" width="380" height="90" rx="8" fill="#e0eadc" stroke="#5e7f5b" stroke-width="1.6"/><text x="1050.0" y="751.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2630">server.py (live mode)</text><text x="1050.0" y="773.0" text-anchor="middle" font-size="13" fill="#4a5864">classifier on pasted text, upload your own CSV</text></svg>